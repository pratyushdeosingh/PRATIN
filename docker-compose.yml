services:
  invoice-risk:
    build: {context: ., dockerfile: services/invoice_risk/Dockerfile}
    ports: ["8001:8001"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"], interval: 5s, timeout: 3s, retries: 10}
  capital-market:
    build: {context: ., dockerfile: services/capital_market/Dockerfile}
    ports: ["8002:8002"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"], interval: 5s, timeout: 3s, retries: 10}
  core:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      PRATIN_INTEGRATION_MODE: required
      INVOICE_RISK_URL: http://invoice-risk:8001
      CAPITAL_MARKET_URL: http://capital-market:8002
      PRATIN_DB_PATH: /app/data/pratin.db
      PRATIN_DATABASE_BACKEND: ${PRATIN_DATABASE_BACKEND:-sqlite}
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-}
    volumes: ["pratin-data:/app/data"]
    ports: ["8000:8000"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"], interval: 5s, timeout: 3s, retries: 10}
    depends_on:
      invoice-risk: {condition: service_healthy}
      capital-market: {condition: service_healthy}
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    environment: {VITE_API_BASE_URL: http://127.0.0.1:8000}
    ports: ["5173:5173"]
    depends_on:
      core: {condition: service_healthy}
volumes:
  pratin-data:
